<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Presença</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; text-align: center; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 90%; }
        button { background: #004a99; color: white; border: none; padding: 15px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #999; cursor: not-allowed; }
        #status { margin-top: 20px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📍Verificação de Local </h2>
        <p>Para acessar o formulário, precisamos confirmar se você está no local do evento.</p>
        <button id="btnValidar" onclick="verificarLocalizacao()">Validar minha presença</button>
        <p id="status"></p>
    </div>
    <script>
        // COORDENADAS DA FICR (Av. Lins Petit)
        const LATITUDE = -8.040812;  //-8.069450
        const LONGITUDE = -34.940038; //-34.894100
        const RAIO_MAXIMO_METROS = 200; // Raio de tolerância (ajustável)

        // =================== LINK DE ACESSO 
        // const LINK_FORMULARIO = "https://forms.gle/gE4r2Rvnqp8ZhKh58"; //manhã
        const LINK_FORMULARIO = "https://forms.gle/S8CYEZ54HmSbHABi7"; //noite

        // =================== DATA PERMITIDA
        const DATA_EVENTO = { dia: 3, mes: 9, ano: 2026 };

        // =================== HORÁRIO PERMITIDO
        const HORA_INICIO = { h: 20, m: 30 };
        const HORA_FIM    = { h: 21, m: 30 };

        function formatarHora(hora) {
            const hh = String(hora.h).padStart(2, '0');
            const mm = String(hora.m).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        function formatarData(data) {
            const dd = String(data.dia).padStart(2, '0');
            const mm = String(data.mes).padStart(2, '0');
            return `${dd}/${mm}/${data.ano}`;
        }

        const MENSAGEM_JANELA = `A verificação de presença só está disponível em ${formatarData(DATA_EVENTO)}, das ${formatarHora(HORA_INICIO)} às ${formatarHora(HORA_FIM)}.`;

        function dataCorreta() {
            const agora = new Date();
            return agora.getDate() === DATA_EVENTO.dia &&
                   (agora.getMonth() + 1) === DATA_EVENTO.mes &&
                   agora.getFullYear() === DATA_EVENTO.ano;
        }

        function dentroDoHorario() {
            const agora = new Date();
            const minutosAgora = agora.getHours() * 60 + agora.getMinutes();
            const minutosInicio = HORA_INICIO.h * 60 + HORA_INICIO.m;
            const minutosFim = HORA_FIM.h * 60 + HORA_FIM.m;
            return minutosAgora >= minutosInicio && minutosAgora <= minutosFim;
        }

        function dentroDaJanelaDeHorario() {
            return dataCorreta() && dentroDoHorario();
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Raio da Terra em metros
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // =================== DETECÇÃO HEURÍSTICA DE GPS SIMULADO ===================
        // Importante: o navegador NÃO tem acesso à flag de "mock location" do sistema
        // operacional (isso só existe para apps nativos). O que segue são sinais
        // indiretos, colhidos a partir de várias leituras de posição, que costumam
        // aparecer em apps de localização falsa. Não é 100% infalível, mas eleva bastante
        // a dificuldade de burlar o sistema com os aplicativos "fake GPS" mais comuns.
        const NUM_AMOSTRAS = 4;           // quantas leituras coletar antes de decidir
        const TEMPO_MAXIMO_COLETA_MS = 9000; // tempo máximo total esperando leituras
        const LIMIAR_SUSPEITA = 2;        // quantos sinais de alerta reprovam a leitura

        function avaliarAmostras(amostras) {
            let suspeita = 0;

            // 1) Precisão "boa demais" ou artificialmente redonda.
            //    GPS real ao ar livre raramente fica abaixo de ~3-5m de precisão;
            //    muitos apps de localização falsa cravam valores baixos e fixos.
            const precisaoMedia = amostras.reduce((s, a) => s + a.coords.accuracy, 0) / amostras.length;
            if (precisaoMedia <= 3) {
                suspeita++;
            }

            // 2) Zero variação entre leituras. GPS real quase sempre tem um pequeno
            //    "jitter" nas últimas casas decimais, mesmo parado.
            const semNenhumaVariacao = amostras.every((a) =>
                a.coords.latitude === amostras[0].coords.latitude &&
                a.coords.longitude === amostras[0].coords.longitude
            );
            if (semNenhumaVariacao && amostras.length > 1) {
                suspeita++;
            }

            // 3) Ausência total de dados de movimento (altitude, velocidade, direção).
            //    Apps de localização falsa tipicamente não simulam esses campos.
            const semDadosDeMovimento = amostras.every(a =>
                a.coords.altitude === null &&
                a.coords.speed === null &&
                a.coords.heading === null
            );
            if (semDadosDeMovimento) {
                suspeita++;
            }

            // 4) "Teleporte": deslocamento fisicamente impossível entre duas leituras
            //    próximas no tempo (indício de alternância entre localização real e falsa).
            for (let i = 1; i < amostras.length; i++) {
                const dist = calcularDistancia(
                    amostras[i - 1].coords.latitude, amostras[i - 1].coords.longitude,
                    amostras[i].coords.latitude, amostras[i].coords.longitude
                );
                const deltaSegundos = (amostras[i].timestamp - amostras[i - 1].timestamp) / 1000;
                if (deltaSegundos > 0 && (dist / deltaSegundos) > 50) { // > ~180 km/h
                    suspeita += 2;
                }
            }

            // 5) Timestamp "congelado" entre leituras (comum quando o valor é injetado
            //    manualmente em vez de vir de um sensor real).
            const timestampsIguais = amostras.every((a, i) => i === 0 || a.timestamp === amostras[i - 1].timestamp);
            if (timestampsIguais && amostras.length > 1) {
                suspeita++;
            }

            return suspeita >= LIMIAR_SUSPEITA;
        }

        function verificarLocalizacao() {
            const status = document.getElementById('status');
            const btn = document.getElementById('btnValidar');

            // Verifica a janela de horário antes de qualquer outra coisa
            if (!dentroDaJanelaDeHorario()) {
                status.style.color = "red";
                status.innerHTML = `<p>Acesso Negado!</p><p>${MENSAGEM_JANELA}</p>`;
                return;
            }

            if (!navigator.geolocation) {
                status.innerText = "Seu navegador não suporta geolocalização.";
                return;
            }

            btn.disabled = true;
            status.style.color = "#555";
            status.innerText = "Confirmando sua localização, aguarde alguns segundos...";

            const amostras = [];
            let watchId = null;
            let finalizado = false;

            const finalizarComErro = (mensagemHtml) => {
                if (finalizado) return;
                finalizado = true;
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                btn.disabled = false;
                status.style.color = "red";
                status.innerHTML = mensagemHtml;
            };

            const finalizarComSucesso = () => {
                if (finalizado) return;
                finalizado = true;
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);

                // Revalida o horário, caso a coleta tenha demorado
                if (!dentroDaJanelaDeHorario()) {
                    btn.disabled = false;
                    status.style.color = "red";
                    status.innerHTML = `<p>Acesso Negado!</p><p>${MENSAGEM_JANELA}</p>`;
                    return;
                }

                if (avaliarAmostras(amostras)) {
                    finalizarComErro("<p>Acesso Negado!</p><p>Não foi possível confirmar uma localização de GPS válida neste dispositivo.</p>");
                    return;
                }

                const ultima = amostras[amostras.length - 1];
                const distancia = calcularDistancia(ultima.coords.latitude, ultima.coords.longitude, LATITUDE, LONGITUDE);

                if (distancia <= RAIO_MAXIMO_METROS) {
                    status.style.color = "green";
                    status.innerText = "Localização confirmada! Redirecionando...";
                    setTimeout(() => { window.location.href = LINK_FORMULARIO; }, 1500);
                } else {
                    btn.disabled = false;
                    status.style.color = "red";
                    status.innerHTML = "<p>Acesso Negado!</p><p>Você não parece estar no local do evento.</p>";
                }
            };

            watchId = navigator.geolocation.watchPosition((pos) => {
                amostras.push(pos);
                if (amostras.length >= NUM_AMOSTRAS) {
                    finalizarComSucesso();
                }
            }, (err) => {
                finalizarComErro("Erro: Você precisa permitir o acesso à localização.");
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: TEMPO_MAXIMO_COLETA_MS });

            // Segurança: se o tempo máximo passar sem amostras suficientes,
            // decide com o que já foi coletado (ou reporta erro se nada chegou).
            setTimeout(() => {
                if (finalizado) return;
                if (amostras.length > 0) {
                    finalizarComSucesso();
                } else {
                    finalizarComErro("Não foi possível obter sua localização a tempo. Tente novamente.");
                }
            }, TEMPO_MAXIMO_COLETA_MS);
        }

        // Ao carregar a página, se estiver fora da janela, avisa e desabilita o botão
        window.addEventListener('DOMContentLoaded', () => {
            if (!dentroDaJanelaDeHorario()) {
                const status = document.getElementById('status');
                const btn = document.getElementById('btnValidar');
                status.style.color = "red";
                status.innerText = MENSAGEM_JANELA;
                btn.disabled = true;
            }
        });
    </script>
</body>
</html>
